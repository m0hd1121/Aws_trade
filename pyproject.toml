[project]
name = "m5-reversal-bot"
version = "1.0.0"
description = "M5 Liquidity Reversal Playbook — production automated trading system"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." so `from tests.conftest import ...` resolves under the bare `pytest`
# console script. `python -m pytest` happens to work without it (it adds
# cwd to sys.path itself), which masked this.
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]

# Development / BACKTEST-and-dashboard compose file. For DEMO/LIVE trading
# (which needs the Windows-only MetaTrader5 package), run the app directly
# on a Windows host instead — see docs/DEPLOYMENT.md.

services:
  m5-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: m5-reversal-bot:latest
    ports:
      # DASHBOARD_BIND controls which host interface the dashboard is
      # reachable on. Default 0.0.0.0 = the public internet, which is only
      # appropriate with DASHBOARD_USERNAME/PASSWORD set (and ideally a
      # firewall). Set DASHBOARD_BIND=127.0.0.1 to expose it to the VPS
      # itself only and reach it over an SSH tunnel:
      #   ssh -N -L 8000:localhost:8000 root@your-vps
      # That needs no third party, no open port, and no shared password.
      - "${DASHBOARD_BIND:-0.0.0.0}:8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: sqlite:////app/data/m5_bot.db
      LOG_DIR: /app/logs
    volumes:
      - m5-data:/app/data
      - m5-logs:/app/logs
      - ../config:/app/config
      - ../data/history:/app/data/history:ro
    restart: unless-stopped
    # Steady state is well under 200MB RSS (see docs/DEPLOYMENT.md) — capped
    # at 320m/128m reservation to leave headroom for the mt5-bridge
    # container on a 1GB host, with memswap_limit giving it a small swap
    # buffer for GC/import bursts rather than a hard OOM kill.
    mem_limit: 320m
    mem_reservation: 128m
    memswap_limit: 512m
    cpus: 1.0

volumes:
  m5-data:
  m5-logs:

# Production overlay: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Points at Postgres instead of SQLite for multi-process durability, tighter
# resource caps, and no host port exposure (front it with your own
# reverse proxy / TLS terminator).

services:
  m5-bot:
    environment:
      DATABASE_URL: postgresql+psycopg2://m5bot:${POSTGRES_PASSWORD}@postgres:5432/m5bot
      LOG_LEVEL: INFO
    depends_on:
      - postgres
    ports: []
    mem_limit: 384m
    cpus: 0.75
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: m5bot
      POSTGRES_USER: m5bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - m5-postgres:/var/lib/postgresql/data
    mem_limit: 256m
    restart: always

volumes:
  m5-postgres:

# Overlay adding a Wine+MT5+mt5linux bridge container, so the main app
# stays on plain Linux with zero Wine installed on its own host.
#
#   docker compose -f docker-compose.yml -f docker-compose.mt5-bridge.yml up -d --build
#
# See docker/mt5-bridge/Dockerfile for the honest caveats on this path —
# it's real, but more fragile than a plain Windows VPS. docs/DEPLOYMENT.md
# has the full tradeoff table.

services:
  m5-bot:
    environment:
      MT5_BRIDGE_MODE: mt5linux
      MT5_BRIDGE_HOST: mt5-bridge
      MT5_BRIDGE_PORT: "8001"
    depends_on:
      - mt5-bridge

  mt5-bridge:
    build:
      context: ./mt5-bridge
    image: m5-mt5-bridge:latest
    environment:
      MT5LINUX_PORT: "8001"
      # Silences Wine's fixme/warn channels. That logging isn't free — on
      # the OLE/RPC noise seen during a slow wineboot it's real CPU spent
      # formatting debug output on a host that has none to spare.
      WINEDEBUG: "-all"
      # Point at YOUR broker's own installer if they ship one (most do, to
      # preselect their server list). Read on FIRST BOOT, not at build
      # time — the terminal installs into the persisted volume below, so
      # changing this means "delete the volume and restart", not "rebuild".
      MT5_SETUP_URL: ${MT5_SETUP_URL:-https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe}
    volumes:
      - mt5-wine-prefix:/opt/wineprefix
    # No host port published by default — only the m5-bot container on the
    # compose network needs to reach it. Uncomment to debug directly:
    # ports:
    #   - "8001:8001"
    restart: unless-stopped
    # Lower than the old Debian/WineHQ image needed: Alpine base, no i386
    # Wine tree, no winetricks runtimes, and explorer/plugplay stopped
    # after boot. The first-boot MT5 install is the peak — that's what
    # memswap_limit's headroom is for.
    mem_limit: 600m
    mem_reservation: 300m
    memswap_limit: 1200m
    cpus: 1.0

volumes:
  mt5-wine-prefix:
